name: Auto Update Subscription

on:
  schedule:
    - cron: '0 */4 * * *' # Запуск каждые 4 часа
  workflow_dispatch: # Позволяет запустить вручную кнопкой в панели GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Даем права на запись изменений в репозиторий

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run parser script
      run: python parser.py

    - name: Commit and push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add subscription.txt subscription_base64.txt
        git diff --cached --quiet || (git commit -m "Update links: $(date -u +'%Y-%m-%d %H:%M:%S') UTC" && git push)

